# Render.com uchun tayyor konfiguratsiya (Blueprint).
#
# Bu fayl bilan ilova bir necha bosqichda joylanadi va DOIMIY manzil oladi:
#     https://<xizmat-nomi>.onrender.com
#
# Manzil hech qachon o'zgarmaydi va kompyuteringiz o'chsa ham sayt ishlaydi.
# Batafsil yo'riqnoma: README, "Bulutga joylash" bo'limi.

databases:
  - name: cashflow-db
    databaseName: cashflow
    user: cashflow
    # Tekin tarif. Ma'lumot muhim bo'lsa pullik tarifga o'ting —
    # tekin bazalar cheklangan muddatga beriladi.
    plan: free

services:
  - type: web
    name: cashflow
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cashflow-db
          property: connectionString

      # Har bir joylashda avtomatik generatsiya qilinadi va saqlanadi.
      # Qo'lda kiritish shart emas.
      - key: JWT_SECRET_KEY
        generateValue: true

      - key: ENVIRONMENT
        value: production

      # Production'da faqat aniq manzillarga ruxsat.
      # Ilova o'z frontendini o'zi tarqatgani uchun CORS amalda kerak emas.
      - key: CORS_ALLOW_LAN
        value: "false"
      - key: FRONTEND_ORIGIN
        # Joylagandan so'ng haqiqiy manzilingizga almashtiring
        value: https://cashflow.onrender.com

      # AI kategoriyalash uchun — ixtiyoriy. Bo'sh qoldirilsa tizim
      # provodkalar bo'yicha ishlayveradi.
      - key: ANTHROPIC_API_KEY
        sync: false

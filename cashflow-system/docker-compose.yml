version: "3.9"

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: cashflow_user
      POSTGRES_PASSWORD: nbzSWsBaraupz15nfCdxpQcOdihSif9X
      POSTGRES_DB: cashflow_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Tashqi port YO'Q. Ilgari "5432:5432" edi — bu bazani butun tarmoqqa
    # ochib qo'yardi. Ilova bazaga docker tarmog'i orqali ulanadi, shuning
    # uchun hostga chiqarish shart emas.
    # Qo'lda tekshirish kerak bo'lsa:
    #   docker compose exec db psql -U cashflow_user -d cashflow_db

  backend:
    build: ./backend
    restart: always
    env_file:
      - ./backend/.env
    depends_on:
      - db
    # Tashqi port YO'Q. API foydalanuvchiga nginx orqali (5173/api) yetadi,
    # shuning uchun 8000 ni alohida ochish kerak emas — ochiq port qancha kam
    # bo'lsa, hujum yuzasi shuncha kichik.
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

  # Ixtiyoriy: internetdan kirish uchun tunnel.
  #
  # Sukut bo'yicha ISHGA TUSHMAYDI — profil orqali ataylab yoqiladi:
  #     docker compose --profile tunnel up -d tunnel
  #     docker compose logs tunnel        # manzilni shu yerdan oling
  #
  # DIQQAT: yoqilgan paytda sayt BUTUN INTERNETGA ochiq bo'ladi.
  # Manzilni bilgan har kim login sahifasiga kira oladi (ma'lumotni
  # faqat parolingiz himoya qiladi). Kerak bo'lmaganda to'xtating:
  #     docker compose stop tunnel
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    depends_on:
      - frontend
    # --protocol http2: sukut bo'yicha cloudflared QUIC (UDP/7844) ishlatadi.
    # Telefon hotspoti va ko'p ofis tarmoqlari UDP'ni bloklaydi yoki cheklaydi —
    # natijada tunnel "control stream failure" bilan uzluksiz qayta ulanadi.
    # HTTP/2 oddiy TCP/443 orqali ishlaydi va deyarli hamma joyda o'tadi.
    command: tunnel --no-autoupdate --protocol http2 --url http://frontend:80

  # Doimiy manzil (o'z domeningiz bilan). Manzil hech qachon o'zgarmaydi.
  #
  # Bir marta sozlanadi — README 5-bo'limiga qarang. Sozlangandan keyin:
  #     docker compose --profile named up -d tunnel-named
  #
  # Yuqoridagi vaqtinchalik "tunnel" bilan bir vaqtda ishlatilmaydi.
  tunnel-named:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["named"]
    depends_on:
      - frontend
    volumes:
      # Kirish ma'lumotlari shu papkada. Ular SIR — .gitignore da.
      - ./cloudflared:/home/nonroot/.cloudflared:ro
    command: >
      tunnel --no-autoupdate --protocol http2
      run --url http://frontend:80 ${TUNNEL_NAME:-cashflow}

volumes:
  pgdata:

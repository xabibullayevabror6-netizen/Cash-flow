server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Yuklanadigan Excel fayllar uchun (standart 1MB juda kam)
    client_max_body_size 25m;

    # Server versiyasini yashirish — hujumchiga ma'lumot bermaydi
    server_tokens off;

    # --- Xavfsizlik sarlavhalari ---
    # Saytni boshqa saytning <iframe> ichiga qo'yib bo'lmaydi (clickjacking).
    add_header X-Frame-Options "DENY" always;
    # Brauzer fayl turini "taxmin qilmasin" — MIME sniffing hujumlariga qarshi.
    add_header X-Content-Type-Options "nosniff" always;
    # Boshqa saytga o'tganda to'liq manzil yuborilmasin.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Kamera, mikrofon, geolokatsiya — ilovaga kerak emas, o'chirilgan.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # HTTPS orqali kelingan bo'lsa, brauzer keyingi safar ham HTTPS ishlatsin.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Faqat o'z manbalaridan yuklansin. Shriftlar Google Fonts'dan kelgani uchun
    # ular alohida ruxsat etilgan; 'unsafe-inline' esa Vite ichki uslublari uchun.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # API shu yerdan proksi qilinadi — frontend va backend bitta manzilda ko'rinadi.
    #
    # Bu nima beradi:
    #   • Bitta port yetarli (5173). Ilgari 8000 ni ham alohida ochish kerak edi.
    #   • CORS umuman kerak emas — so'rov bir xil manzilga ketadi.
    #   • Tunnel/domen orqali chiqarish bitta manzil bilan hal bo'ladi.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Katta importlar uzoq ishlashi mumkin
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Swagger hujjatlari ham shu manzildan ochilsin
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: marshrutlar (/dashboard, /login, ...) fayl emas — hammasi index.html ga yo'naltiriladi,
    # aks holda sahifani yangilaganda nginx 404 qaytaradi.
    #
    # index.html HECH QACHON keshlanmaydi. U yangi build fayllariga ishora
    # qiladi; keshlansa foydalanuvchi eski ilovani ko'raverib, yangi
    # imkoniyatlarni umuman ko'rmaydi (va buni tushuntirib bo'lmaydi).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
        expires -1;
    }

    # Assets fayl nomida kontent xeshi bor — o'zgarsa nomi ham o'zgaradi,
    # shuning uchun ularni uzoq keshlash xavfsiz va tez.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

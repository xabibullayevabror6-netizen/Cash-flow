# Render.com Blueprint - repozitoriya ILDIZIDA turishi kerak.
# Loyiha fayllari cashflow-system/ papkasi ichida, shuning uchun
# Dockerfile yo'li shu papkaga ishora qiladi.

databases:
  - name: cashflow-db
    databaseName: cashflow
    user: cashflow
    plan: free

services:
  - type: web
    name: cashflow
    runtime: docker
    dockerfilePath: ./cashflow-system/Dockerfile
    dockerContext: ./cashflow-system
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cashflow-db
          property: connectionString

      - key: JWT_SECRET_KEY
        generateValue: true

      - key: ENVIRONMENT
        value: production

      - key: CORS_ALLOW_LAN
        value: "false"

      - key: FRONTEND_ORIGIN
        value: https://cashflow-7gkw.onrender.com

      - key: ANTHROPIC_API_KEY
        sync: false
